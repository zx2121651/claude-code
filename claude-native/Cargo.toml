[package]
name = "claude-native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16.4", default-features = false, features = ["napi4", "async", "tokio_rt", "error_anyhow"] }
napi-derive = "2.16.2"
ignore = "0.4.22"
grep-regex = "0.1.13"
grep-searcher = "0.1.14"
termcolor = "1.4.1"
anyhow = "1.0.82"
globset = "0.4.14"
tokio = { version = "1.37.0", features = ["fs", "rt"] }

[build-dependencies]
napi-build = "2.1.3"
